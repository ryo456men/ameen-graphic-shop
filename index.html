<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Ameen Graphic Design Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- =====================
       CSS (readable + centralized)
       ===================== -->
  <style>
    :root { --glass: rgba(2, 6, 23, .55); }

    /* Small extras on top of Tailwind */
    .glass { background: var(--glass); backdrop-filter: blur(12px); }
    .prose-lite p { margin: .75rem 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .focus-ring:focus { outline: 2px solid rgba(56, 189, 248, .65); outline-offset: 2px; }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-cyan-400/20 selection:text-cyan-100">
  <noscript>
    <div class="max-w-3xl mx-auto p-6">
      <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
        This site needs JavaScript enabled to run.
      </div>
    </div>
  </noscript>

  <!-- =====================
       App shell (HTML only)
       ===================== -->
  <div id="app" class="min-h-screen"></div>

  <!-- =====================
       JavaScript Module #1: CORE (state/storage/utilities)
       ===================== -->
  <script>
    (() => {
      'use strict';

      // ----------------- Constants -----------------
      const PRIMARY_ADMIN_EMAIL = 'alakaameen97@gmail.com';
      const SECONDARY_ADMIN_EMAIL = 'dosunmuayobamidele@gmail.com';
      // For backwards compatibility, ADMIN_EMAIL refers to the primary admin
      const ADMIN_EMAIL = PRIMARY_ADMIN_EMAIL;

      const STORAGE_KEYS = {
        data: 'gdshop_data_v1',
        accounts: 'gdshop_accounts_v1',
        session: 'gdshop_session_v1',
        guest: 'gdshop_guest_v1',
        chatIdentity: 'gdshop_chat_identity_v1'
      };

      // ----------------- Utilities -----------------
      const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ESC_MAP[m]);

      const uid = () => Math.random().toString(16).slice(2) + '-' + Date.now().toString(16);
      const now = () => Date.now();

      function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function saveJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function trySaveData(nextData) {
        try {
          saveJSON(STORAGE_KEYS.data, nextData);
          return null;
        } catch (e) {
          return e;
        }
      }

      async function sha256Hex(input) {
        const enc = new TextEncoder();
        const bytes = enc.encode(input);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function fmtMoney(amount, currency) {
        const n = Number(amount);
        if (!Number.isFinite(n)) return `${currency ?? '$'}0`;
        return `${currency ?? '$'}${n.toFixed(0)}`;
      }

      function fmtDate(ts) {
        try {
          return new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: '2-digit' }).format(new Date(ts));
        } catch {
          return new Date(ts).toLocaleDateString();
        }
      }

      function fmtTime(ts) {
        try {
          return new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' }).format(new Date(ts));
        } catch {
          return new Date(ts).toLocaleTimeString();
        }
      }

      function parseRoute() {
        const raw = (location.hash || '#/home').slice(1);
        const [pathRaw, queryRaw] = raw.split('?');
        const path = pathRaw || '/home';
        const query = new URLSearchParams(queryRaw || '');
        return { path, query };
      }

      function go(path) {
        if (!path.startsWith('/')) path = '/' + path;
        location.hash = path;
      }

      function isAdminEmail(email) {
        const normalized = String(email || '').trim().toLowerCase();
        const primary = PRIMARY_ADMIN_EMAIL.toLowerCase();
        const secondary = SECONDARY_ADMIN_EMAIL.toLowerCase();
        // PRIMARY_ADMIN_EMAIL has full authority, SECONDARY_ADMIN_EMAIL is backup only
        return normalized === primary || normalized === secondary;
      }

      function isPrimaryAdmin(email) {
        return String(email || '').trim().toLowerCase() === PRIMARY_ADMIN_EMAIL.toLowerCase();
      }

      function normalizeYouTubeUrl(url) {
        const u = String(url || '').trim();
        if (!u) return null;
        try {
          const parsed = new URL(u);
          const host = parsed.hostname.replace('www.', '');
          if (host === 'youtu.be') {
            const id = parsed.pathname.slice(1);
            if (!id) return null;
            return `https://www.youtube.com/embed/${id}`;
          }
          if (host === 'youtube.com' || host === 'm.youtube.com') {
            if (parsed.pathname === '/watch') {
              const id = parsed.searchParams.get('v');
              if (!id) return null;
              return `https://www.youtube.com/embed/${id}`;
            }
            if (parsed.pathname.startsWith('/embed/')) return u;
            if (parsed.pathname.startsWith('/shorts/')) {
              const id = parsed.pathname.split('/').filter(Boolean)[1];
              if (!id) return null;
              return `https://www.youtube.com/embed/${id}`;
            }
          }
          return null;
        } catch {
          return null;
        }
      }

      function inferMediaTypeFromSrc(src) {
        const s = String(src || '').trim();
        if (!s) return { mediaType: null, src: '' };
        const yt = normalizeYouTubeUrl(s);
        if (yt) return { mediaType: 'embed', src: yt };

        const lower = s.toLowerCase();
        if (lower.startsWith('data:video/')) return { mediaType: 'video', src: s };
        if (lower.startsWith('data:image/')) return { mediaType: 'image', src: s };
        if (lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.ogg')) return { mediaType: 'video', src: s };
        return { mediaType: 'image', src: s };
      }

      // ----------------- Data (seed + load) -----------------
      function seedData() {
        return {
          version: 1,
          updatedAt: now(),
          site: {
            brandName: 'Ameen Graphic Design',
            tagline: 'Branding � Logos � Social Media � Motion Graphics',
            heroImageUrl: 'https://images.unsplash.com/photo-1526498460520-4c246339dccb?auto=format&fit=crop&w=1800&q=80',
            about: "We're a graphic design shop focused on clean visuals, strong branding, and fast turnarounds. From logos and brand systems to social media kits and short motion promos'we help your ideas look professional.",
            contact: {
              email: 'contact@yourstudio.com',
              phone: '+000 000 0000',
              address: 'Your City, Your Country',
              whatsapp: ''
            },
            socials: {
              instagram: '',
              behance: '',
              tiktok: ''
            }
          },
          services: [
            {
              id: uid(),
              name: 'Logo Starter',
              price: 49,
              currency: '$',
              description: 'Perfect for new projects that need a clean, modern logo.',
              bullets: ['2 concepts', '2 revisions', 'PNG/SVG files'],
              popular: false
            },
            {
              id: uid(),
              name: 'Brand Kit',
              price: 149,
              currency: '$',
              description: 'A complete mini-brand system for consistent visuals.',
              bullets: ['Logo + variations', 'Color palette + typography', 'Social profile assets'],
              popular: true
            },
            {
              id: uid(),
              name: 'Social Media Pack',
              price: 99,
              currency: '$',
              description: 'Templates you can reuse for posts, stories, and promos.',
              bullets: ['10 templates', 'Editable files', 'Fast delivery'],
              popular: false
            }
          ],
          discounts: [
            {
              id: uid(),
              title: 'New Client Discount',
              percent: 10,
              code: 'HELLO10',
              until: '2026-12-31',
              details: 'Valid for first-time clients on any package.',
              active: true
            }
          ],
          portfolio: [
            {
              id: uid(),
              title: 'Minimal Logo Concept',
              category: 'Branding',
              description: 'Minimal mark concept with strong contrast and scalability.',
              mediaType: 'image',
              src: 'https://images.unsplash.com/photo-1523726491678-bf852e717f6a?auto=format&fit=crop&w=1400&q=80',
              createdAt: now()
            },
            {
              id: uid(),
              title: 'Poster Layout Study',
              category: 'Print',
              description: 'Bold typography + grid composition for event posters.',
              mediaType: 'image',
              src: 'https://images.unsplash.com/photo-1526481280695-3c687fd5432c?auto=format&fit=crop&w=1400&q=80',
              createdAt: now()
            },
            {
              id: uid(),
              title: 'Motion Promo (Sample)',
              category: 'Motion',
              description: 'Short promo/intro sample (YouTube embed).',
              mediaType: 'embed',
              src: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ',
              createdAt: now()
            }
          ],
          inquiries: [],
          chat: {
            threads: {}
          }
        };
      }

      function getData() {
        const existing = loadJSON(STORAGE_KEYS.data, null);
        if (existing && existing.version === 1) return existing;
        const seeded = seedData();
        saveJSON(STORAGE_KEYS.data, seeded);
        return seeded;
      }

      function getAccounts() {
        return loadJSON(STORAGE_KEYS.accounts, { version: 1, users: {} });
      }

      function getSession() {
        return loadJSON(STORAGE_KEYS.session, { version: 1, email: null });
      }

      function setSession(email) {
        saveJSON(STORAGE_KEYS.session, { version: 1, email });
      }

      function clearSession() {
        setSession(null);
      }

      function getGuest() {
        const g = loadJSON(STORAGE_KEYS.guest, null);
        if (g?.id && g?.createdAt) return g;
        const next = { id: 'guest-' + uid(), createdAt: now() };
        saveJSON(STORAGE_KEYS.guest, next);
        return next;
      }

      // ----------------- App state -----------------
      const app = {
        data: getData(),
        accounts: getAccounts(),
        session: getSession(),
        route: parseRoute(),
        ui: {
          mobileOpen: false,
          portfolioFilter: 'All',
          portfolioDraftMedia: null
        },
        toast: null,
        toastTimer: null
      };

      // ----------------- Primary behavior helpers -----------------
      let _renderFn = () => {};
      function setRender(fn) {
        _renderFn = typeof fn === 'function' ? fn : () => {};
      }
      function requestRender() {
        try { _renderFn(); } catch { /* ignore */ }
      }

      function currentUser() {
        const email = app.session?.email;
        if (!email) return null;
        return { email };
      }

      function userIsAdmin() {
        const user = currentUser();
        if (!user) return false;
        return isAdminEmail(user.email);
      }

      function userIsPrimaryAdmin() {
        const user = currentUser();
        if (!user) return false;
        return isPrimaryAdmin(user.email);
      }

      function showToast(message, type = 'info') {
        app.toast = { message, type, id: uid() };
        if (app.toastTimer) clearTimeout(app.toastTimer);
        app.toastTimer = setTimeout(() => {
          app.toast = null;
          requestRender();
        }, 3200);
        requestRender();
      }

      function categoriesFromPortfolio() {
        const cats = new Set(['All']);
        for (const item of app.data.portfolio) cats.add(item.category || 'Uncategorized');
        return Array.from(cats);
      }

      function getActiveDiscounts() {
        const today = new Date();
        return (app.data.discounts || []).filter(d => {
          if (!d.active) return false;
          if (!d.until) return true;
          const end = new Date(d.until + 'T23:59:59');
          return end >= today;
        });
      }

      function ensureAdminGuard() {
        const isAdminRoute = app.route.path.startsWith('/admin');
        if (isAdminRoute && !userIsAdmin()) {
          const next = encodeURIComponent(app.route.path + (location.hash.includes('?') ? '?' + location.hash.split('?')[1] : ''));
          go(`/auth?mode=signin&next=${next}`);
          return true;
        }
        return false;
      }

      // ----------------- Chat helpers -----------------
      function clientThreadIdFromEmail(email) {
        return 'email:' + String(email || '').trim().toLowerCase();
      }

      function getOrCreateThread(name, email) {
        const tid = clientThreadIdFromEmail(email);
        if (!app.data.chat.threads[tid]) {
          app.data.chat.threads[tid] = {
            id: tid,
            name: name || '',
            email: email || '',
            createdAt: now(),
            updatedAt: now(),
            adminLastReadAt: 0,
            clientLastReadAt: 0,
            messages: []
          };
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) throw err;
        }
        return app.data.chat.threads[tid];
      }

      function addMessageToThread(threadId, from, text) {
        const t = app.data.chat.threads[threadId];
        if (!t) return;
        const msg = { id: uid(), from, text: String(text || '').slice(0, 4000), ts: now() };
        t.messages.push(msg);
        t.updatedAt = now();
        app.data.updatedAt = now();
        const err = trySaveData(app.data);
        if (err) throw err;
      }

      // ----------------- Remote sync helpers -----------------
      const SYNC_CONFIG_KEY = 'gdshop_sync_config_v1';

      function getRemoteSyncConfig() {
        return loadJSON(SYNC_CONFIG_KEY, { endpoint: '', secret: '' });
      }

      function saveRemoteSyncConfig(endpoint, secret) {
        saveJSON(SYNC_CONFIG_KEY, { endpoint: String(endpoint || '').trim(), secret: String(secret || '').trim() });
      }

      async function pullFromRemote() {
        const cfg = getRemoteSyncConfig();
        if (!cfg.endpoint) throw new Error('Remote endpoint not configured');
        const resp = await fetch(cfg.endpoint, { method: 'GET' });
        if (!resp.ok) throw new Error(`Remote error: ${resp.status}`);
        const remote = await resp.json();
        if (!remote || typeof remote !== 'object') throw new Error('Invalid remote data');
        app.data = Object.assign({}, app.data, remote);
        const err = trySaveData(app.data);
        if (err) throw err;
        return { success: true, updatedAt: app.data.updatedAt };
      }

      async function pushToRemote() {
        const cfg = getRemoteSyncConfig();
        if (!cfg.endpoint) throw new Error('Remote endpoint not configured');
        if (!cfg.secret) throw new Error('Remote secret not configured');
        const resp = await fetch(cfg.endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-gdshop-secret': cfg.secret
          },
          body: JSON.stringify(app.data)
        });
        if (!resp.ok) throw new Error(`Remote error: ${resp.status}`);
        const result = await resp.json();
        if (!result.ok) throw new Error(result.error || 'Remote write failed');
        return { success: true, updatedAt: result.updatedAt };
      }

      // ----------------- Export core API -----------------
      window.GDShopCore = {
        ADMIN_EMAIL,
        PRIMARY_ADMIN_EMAIL,
        SECONDARY_ADMIN_EMAIL,
        STORAGE_KEYS,
        // util
        escapeHtml,
        uid,
        now,
        loadJSON,
        saveJSON,
        trySaveData,
        sha256Hex,
        fmtMoney,
        fmtDate,
        fmtTime,
        parseRoute,
        go,
        isAdminEmail,
        isPrimaryAdmin,
        normalizeYouTubeUrl,
        inferMediaTypeFromSrc,
        // data
        seedData,
        getData,
        getAccounts,
        getSession,
        setSession,
        clearSession,
        getGuest,
        // state
        app,
        // behaviors
        setRender,
        requestRender,
        currentUser,
        userIsAdmin,
        userIsPrimaryAdmin,
        showToast,
        categoriesFromPortfolio,
        getActiveDiscounts,
        ensureAdminGuard,
        // chat
        clientThreadIdFromEmail,
        getOrCreateThread,
        addMessageToThread,
        // remote sync
        getRemoteSyncConfig,
        saveRemoteSyncConfig,
        pullFromRemote,
        pushToRemote
      };
    })();
  </script>

  <!-- =====================
       JavaScript Module #2: VIEWS (page HTML rendering only)
       ===================== -->
  <script>
    (() => {
      'use strict';

      const Core = window.GDShopCore;
      const {
        app,
        ADMIN_EMAIL,
        escapeHtml,
        fmtMoney,
        fmtDate,
        fmtTime,
        now,
        inferMediaTypeFromSrc,
        getActiveDiscounts,
        categoriesFromPortfolio,
        currentUser,
        userIsAdmin,
        getGuest,
        loadJSON
      } = Core;

      // ----------------- Small UI helpers -----------------
      function renderBadge(text) {
        return `<span class="inline-flex items-center gap-1 rounded-full border border-slate-700 bg-slate-900 px-2.5 py-1 text-xs text-slate-200">${escapeHtml(text)}</span>`;
      }

      function renderToast() {
        if (!app.toast) return '';
        const color = app.toast.type === 'error'
          ? 'border-rose-600/40 bg-rose-950/60'
          : app.toast.type === 'success'
            ? 'border-emerald-600/40 bg-emerald-950/60'
            : 'border-cyan-600/40 bg-slate-900/60';
        return `
          <div class="fixed left-1/2 top-4 z-[60] w-[min(560px,calc(100vw-2rem))] -translate-x-1/2">
            <div class="glass rounded-xl border ${color} px-4 py-3 shadow-2xl">
              <div class="flex items-start justify-between gap-3">
                <div class="text-sm text-slate-100">${escapeHtml(app.toast.message)}</div>
                <button class="focus-ring rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-xs text-slate-200 hover:bg-slate-800" data-action="dismiss-toast">Close</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderNav() {
        const user = currentUser();
        const isAdmin = userIsAdmin();

        const link = (to, label) => {
          const active = app.route.path === to || (to !== '/home' && app.route.path.startsWith(to));
          const cls = active
            ? 'text-cyan-200 border-cyan-400/30 bg-cyan-500/10'
            : 'text-slate-200 border-transparent hover:border-slate-700 hover:bg-slate-900';
          return `<a href="#${to}" class="rounded-lg border px-3 py-2 text-sm ${cls}">${escapeHtml(label)}</a>`;
        };

        const adminLink = isAdmin
          ? `<a href="#/admin" class="rounded-lg border border-transparent px-3 py-2 text-sm text-amber-200 hover:border-amber-400/30 hover:bg-amber-500/10">Admin</a>`
          : '';

        return `
          <header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
              <a href="#/home" class="group flex items-center gap-3">
                <div class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-cyan-500/25 to-indigo-500/25 ring-1 ring-slate-700">
                  <svg class="h-6 w-6 text-cyan-200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 17l6-6 4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 7h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="leading-tight">
                  <div class="font-semibold tracking-tight text-slate-100 group-hover:text-white">${escapeHtml(app.data.site.brandName)}</div>
                  <div class="text-xs text-slate-400">${escapeHtml(app.data.site.tagline)}</div>
                </div>
              </a>

              <nav class="hidden items-center gap-1 md:flex">
                ${link('/home', 'Home')}
                ${link('/portfolio', 'Portfolio')}
                ${link('/services', 'Services')}
                ${link('/discounts', 'Discounts')}
                ${link('/about', 'About')}
                ${link('/contact', 'Contact')}
                ${link('/chat', 'Chat')}
                ${adminLink}
              </nav>

              <div class="flex items-center gap-2">
                ${user ? `
                  <div class="hidden md:flex items-center gap-2">
                    ${renderBadge(user.email)}
                    <button class="focus-ring rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800" data-action="signout">Sign out</button>
                  </div>
                ` : `
                  <a href="#/auth?mode=signin" class="hidden md:inline-flex focus-ring rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Sign in</a>
                `}

                <button class="focus-ring inline-flex items-center justify-center rounded-lg border border-slate-700 bg-slate-900 p-2 text-slate-200 hover:bg-slate-800 md:hidden" data-action="toggle-mobile" aria-label="Open menu">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>

            ${app.ui.mobileOpen ? `
              <div class="border-t border-slate-800 bg-slate-950/95">
                <div class="mx-auto max-w-6xl px-4 py-3">
                  <div class="grid grid-cols-2 gap-2">
                    ${link('/home', 'Home')}
                    ${link('/portfolio', 'Portfolio')}
                    ${link('/services', 'Services')}
                    ${link('/discounts', 'Discounts')}
                    ${link('/about', 'About')}
                    ${link('/contact', 'Contact')}
                    ${link('/chat', 'Chat')}
                    ${isAdmin ? `<a href="#/admin" class="rounded-lg border border-amber-400/20 bg-amber-500/10 px-3 py-2 text-sm text-amber-200">Admin</a>` : (user ? '' : `<a href="#/auth?mode=signin" class="rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-200">Sign in</a>`)}
                    ${user ? `<button class="focus-ring rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-200" data-action="signout">Sign out</button>` : ''}
                  </div>
                </div>
              </div>
            ` : ''}
          </header>
        `;
      }

      function renderFooter() {
        const year = new Date().getFullYear();
        const s = app.data.site;
        const contact = s.contact || {};
        const socials = s.socials || {};

        const socialLink = (label, url) => {
          if (!url) return '';
          const safe = escapeHtml(url);
          return `<a class="text-sm text-slate-300 hover:text-white" href="${safe}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a>`;
        };

        return `
          <footer class="border-t border-slate-800 bg-slate-950">
            <div class="mx-auto max-w-6xl px-4 py-10">
              <div class="grid gap-8 md:grid-cols-3">
                <div>
                  <div class="text-base font-semibold">${escapeHtml(s.brandName)}</div>
                  <div class="mt-2 text-sm text-slate-400">${escapeHtml(s.tagline)}</div>
                </div>
                <div>
                  <div class="text-sm font-semibold text-slate-200">Quick links</div>
                  <div class="mt-3 grid gap-2">
                    <a class="text-sm text-slate-300 hover:text-white" href="#/portfolio">Portfolio</a>
                    <a class="text-sm text-slate-300 hover:text-white" href="#/services">Services</a>
                    <a class="text-sm text-slate-300 hover:text-white" href="#/discounts">Discounts</a>
                    <a class="text-sm text-slate-300 hover:text-white" href="#/chat">Chat with us</a>
                  </div>
                </div>
                <div>
                  <div class="text-sm font-semibold text-slate-200">Contact</div>
                  <div class="mt-3 grid gap-2 text-sm text-slate-300">

      function renderAdminInbox() {
        const threads = Object.values(app.data.chat?.threads || {}).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        const selected = app.route.query.get('t') || (threads[0]?.id || '');
        const thread = selected ? (app.data.chat.threads[selected] || null) : null;

        const unreadCount = (t) => {
          const last = t.adminLastReadAt || 0;
          return (t.messages || []).filter(m => m.from === 'client' && m.ts > last).length;
        };

        const row = (t) => {
          const isOn = t.id === selected;
          const unread = unreadCount(t);
          const cls = isOn ? 'border-amber-400/30 bg-amber-500/10' : 'border-slate-800 bg-slate-950/30 hover:bg-slate-950/40';
          return `
            <a href="#/admin/inbox?t=${encodeURIComponent(t.id)}" class="block rounded-xl border ${cls} p-3">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="truncate text-sm font-semibold text-white">${escapeHtml(t.name || 'Client')}</div>
                  <div class="truncate text-xs text-slate-400">${escapeHtml(t.email || t.id)}</div>
                </div>
                ${unread ? `<span class="rounded-full border border-cyan-400/30 bg-cyan-500/10 px-2 py-0.5 text-[11px] font-semibold text-cyan-100">${unread}</span>` : ''}
              </div>
              <div class="mt-2 text-[11px] text-slate-500">Updated: ${escapeHtml(fmtDate(t.updatedAt || t.createdAt || now()))}</div>
            </a>
          `;
        };

        const msgBubble = (m) => {
          const mine = m.from === 'admin';
          const align = mine ? 'justify-end' : 'justify-start';
          const bubble = mine ? 'bg-amber-500/10 border-amber-400/20 text-amber-50' : 'bg-slate-900/60 border-slate-700 text-slate-100';
          const who = mine ? 'Admin' : 'Client';
          return `
            <div class="flex ${align}">
              <div class="max-w-[88%] rounded-2xl border ${bubble} px-4 py-3">
                <div class="flex items-center justify-between gap-3">
                  <div class="text-[11px] font-semibold text-slate-200/90">${escapeHtml(who)}</div>
                  <div class="text-[11px] text-slate-400">${escapeHtml(fmtTime(m.ts))}</div>
                </div>
                <div class="mt-1 whitespace-pre-wrap text-sm leading-relaxed">${escapeHtml(m.text)}</div>
              </div>
            </div>
          `;
        };

        const messagesHtml = thread
          ? (thread.messages || []).map(msgBubble).join('')
          : `<div class="rounded-xl border border-slate-800 bg-slate-950/30 p-4 text-sm text-slate-300">No thread selected.</div>`;

        return `
          <div class="grid gap-4 lg:grid-cols-5">
            <div class="lg:col-span-2 rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
              <div class="text-sm font-semibold text-white">Threads</div>
              <div class="mt-1 text-xs text-slate-400">Client messages grouped by email.</div>
              <div class="mt-4 grid gap-2 max-h-[560px] overflow-y-auto pr-1 no-scrollbar">
                ${threads.length ? threads.map(row).join('') : `<div class="rounded-xl border border-slate-800 bg-slate-950/30 p-4 text-sm text-slate-300">No chats yet.</div>`}
              </div>
            </div>

            <div class="lg:col-span-3 rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <div class="text-sm font-semibold text-white">Conversation</div>
                  <div class="mt-1 text-xs text-slate-400">${thread ? `${escapeHtml(thread.name || 'Client')} � ${escapeHtml(thread.email || thread.id)}` : ''}</div>
                </div>
                ${thread ? `<button class="focus-ring rounded-xl border border-slate-700 bg-slate-900/30 px-3 py-2 text-xs font-semibold text-slate-200 hover:bg-slate-900" data-action="admin-mark-read" data-id="${escapeHtml(thread.id)}">Mark read</button>` : ''}
              </div>

              <div id="admin-chat-messages" class="no-scrollbar mt-4 h-[420px] overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/30 p-4">
                <div class="grid gap-3">${messagesHtml}</div>
              </div>

              <form id="form-admin-chat-reply" class="mt-4 flex gap-2">
                <input type="hidden" name="threadId" value="${escapeHtml(thread?.id || '')}" />
                <input name="text" class="focus-ring w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm" placeholder="Write a reply..." ${thread ? '' : 'disabled'} required />
                <button class="focus-ring rounded-xl bg-amber-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-amber-300 disabled:cursor-not-allowed disabled:opacity-50" type="submit" ${thread ? '' : 'disabled'}>Reply</button>
              </form>
            </div>
          </div>
        `;
      }

      function renderAdminBackup() {
        const Core = window.GDShopCore;
        const cfg = Core.getRemoteSyncConfig();
        const endpoint = cfg.endpoint || '';
        const hasEndpoint = endpoint && endpoint.length > 0;

        return `
          <div class="grid gap-4 lg:grid-cols-3">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6">
              <div class="text-base font-semibold text-white">Remote sync</div>
              <div class="mt-2 text-sm text-slate-300">Connect to a backend server to sync and backup your data across devices.</div>
              <div class="mt-4 grid gap-2">
                <label class="grid gap-1">
                  <span class="text-xs text-slate-300">Endpoint URL</span>
                  <input id="admin-sync-endpoint" type="text" class="focus-ring w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm" value="${escapeHtml(endpoint)}" placeholder="https://your-backend.onrender.com/data" />
                </label>
                <label class="grid gap-1">
                  <span class="text-xs text-slate-300">Secret key</span>
                  <input id="admin-sync-secret" type="password" class="focus-ring w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm" value="${escapeHtml(cfg.secret || '')}" placeholder="your-secret-key" />
                </label>
                <button class="focus-ring rounded-xl bg-cyan-500/20 px-4 py-2 text-sm font-semibold text-cyan-100 ring-1 ring-cyan-400/30 hover:bg-cyan-500/25" data-action="admin-sync-save">Save config</button>
              </div>
              ${hasEndpoint ? `
                <div class="mt-4 flex flex-wrap gap-2">
                  <button class="focus-ring rounded-xl bg-emerald-500/10 px-3 py-2 text-xs font-semibold text-emerald-200 ring-1 ring-emerald-400/30 hover:bg-emerald-500/15" data-action="admin-sync-pull">Pull from server</button>
                  <button class="focus-ring rounded-xl bg-amber-500/10 px-3 py-2 text-xs font-semibold text-amber-200 ring-1 ring-amber-400/30 hover:bg-amber-500/15" data-action="admin-sync-push">Push to server</button>
                </div>
                <div class="mt-2 text-xs text-slate-500">Configured endpoint: ${escapeHtml(endpoint)}</div>
              ` : `<div class="mt-3 rounded-lg border border-slate-800 bg-slate-950/30 p-3 text-xs text-slate-400"><b>Setup:</b> Enter your backend URL and secret above, then click Save config.</div>`}
            </div>

            <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6">
              <div class="text-base font-semibold text-white">Export</div>
              <div class="mt-2 text-sm text-slate-300">Download your current site data (portfolio, services, discounts, chats, inquiries) as JSON.</div>
              <button class="focus-ring mt-4 rounded-xl bg-white/10 px-4 py-2.5 text-sm font-semibold text-white ring-1 ring-slate-700 hover:bg-white/15" data-action="admin-export-json">Download JSON</button>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6">
              <div class="text-base font-semibold text-white">Import</div>
              <div class="mt-2 text-sm text-slate-300">Upload a JSON backup to restore your site data.</div>
              <div class="mt-4 grid gap-2">
                <input id="admin-import-file" type="file" accept="application/json" class="focus-ring w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm" />
                <button class="focus-ring rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-sm font-semibold text-rose-200 hover:bg-rose-500/15" data-action="admin-import-json">Import & replace current data</button>
              </div>
              <div class="mt-3 text-xs text-slate-500">Import overwrites current content in this browser.</div>
            </div>
          </div>
        `;
      }

      function renderNotFound() {
        return `
          <section class="mx-auto max-w-4xl px-4 py-12">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6">
              <div class="text-lg font-semibold text-white">Page not found</div>
              <div class="mt-2 text-sm text-slate-300">That route doesn't exist.</div>
              <a href="#/home" class="mt-5 inline-flex focus-ring rounded-xl bg-cyan-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-cyan-400">Go home</a>
            </div>
          </section>
        `;
      }

      // ----------------- Export views API -----------------
      window.GDShopViews = {
        renderToast,
        renderNav,
        renderFooter,
        renderHome,
        renderPortfolio,
        renderServices,
        renderDiscounts,
        renderAbout,
        renderContact,
        renderChat,
        renderAuth,
        renderAdmin,
        renderNotFound
      };
    })();
  </script>

  <!-- =====================
       JavaScript Module #3: CONTROLLER (routing, events, app flow)
       ===================== -->
  <script>
    (() => {
      'use strict';

      const Core = window.GDShopCore;
      const Views = window.GDShopViews;

      const {
        ADMIN_EMAIL,
        STORAGE_KEYS,
        app,
        uid,
        now,
        parseRoute,
        ensureAdminGuard,
        escapeHtml,
        trySaveData,
        inferMediaTypeFromSrc,
        fmtDate,
        getData,
        getAccounts,
        getSession,
        setSession,
        clearSession,
        seedData,
        loadJSON,
        saveJSON,
        sha256Hex,
        isAdminEmail,
        showToast,
        getOrCreateThread,
        addMessageToThread,
        go,
        getRemoteSyncConfig,
        saveRemoteSyncConfig,
        pullFromRemote,
        pushToRemote
      } = Core;

      function renderMain() {
        switch (app.route.path) {
          case '/home':
          case '/':
            return Views.renderHome();
          case '/portfolio':
            return Views.renderPortfolio();
          case '/services':
            return Views.renderServices();
          case '/discounts':
            return Views.renderDiscounts();
          case '/about':
            return Views.renderAbout();
          case '/contact':
            return Views.renderContact();
          case '/chat':
            return Views.renderChat();
          case '/auth':
            return Views.renderAuth();
          case '/admin':
          case '/admin/overview':
          case '/admin/portfolio':
          case '/admin/services':
          case '/admin/discounts':
          case '/admin/site':
          case '/admin/inquiries':
          case '/admin/inbox':
          case '/admin/backup':
            return Views.renderAdmin();
          default:
            if (app.route.path.startsWith('/admin')) return Views.renderAdmin();
            return Views.renderNotFound();
        }
      }

      function render() {
        app.route = parseRoute();
        if (ensureAdminGuard()) return;

        const root = document.getElementById('app');

        const titleBase = app.data.site.brandName || 'Graphic Design Shop';
        const pageTitle = (() => {
          const p = app.route.path;
          if (p === '/home' || p === '/') return 'Home';
          if (p === '/portfolio') return 'Portfolio';
          if (p === '/services') return 'Services';
          if (p === '/discounts') return 'Discounts';
          if (p === '/about') return 'About';
          if (p === '/contact') return 'Contact';
          if (p === '/chat') return 'Chat';
          if (p.startsWith('/admin')) return 'Admin';
          if (p === '/auth') return 'Account';
          return 'Page';
        })();
        document.title = `${pageTitle} � ${titleBase}`;

        root.innerHTML = `
          ${Views.renderToast()}
          <div class="min-h-screen flex flex-col">
            ${Views.renderNav()}
            <main class="flex-1">${renderMain()}</main>
            ${Views.renderFooter()}
          </div>
        `;

        // Auto-scroll chat boxes to bottom
        const chatBox = document.getElementById('chat-messages');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        const adminChatBox = document.getElementById('admin-chat-messages');
        if (adminChatBox) adminChatBox.scrollTop = adminChatBox.scrollHeight;
      }

      // Connect toast rendering to the controller's render()
      Core.setRender(render);

      // ----------------- Events: click -----------------
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;

        if (action === 'toggle-mobile') {
          app.ui.mobileOpen = !app.ui.mobileOpen;
          render();
          return;
        }

        if (action === 'dismiss-toast') {
          app.toast = null;
          render();
          return;
        }

        if (action === 'signout') {
          clearSession();
          app.session = getSession();
          app.ui.mobileOpen = false;
          showToast('Signed out.', 'success');
          go('/home');
          return;
        }

        if (action === 'set-portfolio-filter') {
          app.ui.portfolioFilter = btn.dataset.filter || 'All';
          render();
          return;
        }

        if (action === 'chat-prompt') {
          const t = String(btn.dataset.text || '').trim();
          const input = document.querySelector('#form-chat-send input[name="text"]');
          if (input && !input.disabled) {
            input.value = t;
            input.focus();
          } else {
            showToast('Open a chat first (enter name + email).', 'info');
          }
          return;
        }

        if (action === 'admin-clear-portfolio-media') {
          app.ui.portfolioDraftMedia = null;
          showToast('Cleared uploaded media draft.', 'success');
          render();
          return;
        }

        if (action === 'admin-delete-portfolio') {
          const id = btn.dataset.id;
          if (!id) return;
          if (!confirm('Delete this portfolio item?')) return;
          app.data.portfolio = (app.data.portfolio || []).filter(x => x.id !== id);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save (storage full). Try removing large uploads.', 'error');
            return;
          }
          showToast('Deleted portfolio item.', 'success');
          go('/admin/portfolio');
          return;
        }

        if (action === 'admin-delete-service') {
          const id = btn.dataset.id;
          if (!id) return;
          if (!confirm('Delete this service?')) return;
          app.data.services = (app.data.services || []).filter(x => x.id !== id);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Deleted service.', 'success');
          go('/admin/services');
          return;
        }

        if (action === 'admin-delete-discount') {
          const id = btn.dataset.id;
          if (!id) return;
          if (!confirm('Delete this discount?')) return;
          app.data.discounts = (app.data.discounts || []).filter(x => x.id !== id);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Deleted discount.', 'success');
          go('/admin/discounts');
          return;
        }

        if (action === 'admin-resolve-inquiry') {
          const id = btn.dataset.id;
          const q = (app.data.inquiries || []).find(x => x.id === id);
          if (!q) return;
          q.status = 'resolved';
          q.resolvedAt = now();
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Inquiry marked as resolved.', 'success');
          render();
          return;
        }

        if (action === 'admin-delete-inquiry') {
          const id = btn.dataset.id;
          if (!id) return;
          if (!confirm('Delete this inquiry?')) return;
          app.data.inquiries = (app.data.inquiries || []).filter(x => x.id !== id);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Inquiry deleted.', 'success');
          render();
          return;
        }

        if (action === 'admin-mark-read') {
          const id = btn.dataset.id;
          const t = app.data.chat.threads[id];
          if (!t) return;
          t.adminLastReadAt = now();
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Marked as read.', 'success');
          render();
          return;
        }

        if (action === 'admin-sync-save') {
          const endpointEl = document.querySelector('#admin-sync-endpoint');
          const secretEl = document.querySelector('#admin-sync-secret');
          const endpoint = endpointEl?.value || '';
          const secret = secretEl?.value || '';
          saveRemoteSyncConfig(endpoint, secret);
          showToast('Remote sync config saved!', 'success');
          render();
          return;
        }

        if (action === 'admin-sync-pull') {
          showToast('Pulling from remote...', 'info');
          pullFromRemote().then(() => {
            showToast('Data pulled successfully!', 'success');
            render();
          }).catch(err => {
            showToast('Pull failed: ' + err.message, 'error');
            console.error('Pull error', err);
          });
          return;
        }

        if (action === 'admin-sync-push') {
          showToast('Pushing to remote...', 'info');
          pushToRemote().then(() => {
            showToast('Data pushed successfully!', 'success');
            render();
          }).catch(err => {
            showToast('Push failed: ' + err.message, 'error');
            console.error('Push error', err);
          });
          return;
        }

        if (action === 'admin-export-json') {
          const blob = new Blob([JSON.stringify(app.data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `gdshop-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Downloaded JSON backup.', 'success');
          return;
        }

        if (action === 'admin-import-json') {
          const input = document.getElementById('admin-import-file');
          const file = input?.files?.[0];
          if (!file) {
            showToast('Choose a JSON file first.', 'info');
            return;
          }
          if (!confirm('Import will overwrite ALL current data in this browser. Continue?')) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result || ''));
              if (!parsed || typeof parsed !== 'object') throw new Error('Invalid JSON');
              parsed.version = 1;
              parsed.updatedAt = now();
              const err = trySaveData(parsed);
              if (err) {
                showToast('Import failed (storage issue).', 'error');
                return;
              }
              app.data = getData();
              showToast('Imported backup successfully.', 'success');
              go('/admin/overview');
            } catch {
              showToast('Invalid JSON file.', 'error');
            }
          };
          reader.readAsText(file);
          return;
        }

      });

      // ----------------- Events: file inputs -----------------
      document.addEventListener('change', (e) => {
        const input = e.target;
        if (input && input.id === 'portfolio-media-file') {
          const file = input.files?.[0];
          if (!file) return;

          const maxBytes = 3.5 * 1024 * 1024; // ~3.5 MB recommended for localStorage
          if (file.size > maxBytes) {
            showToast('File is large. Prefer URLs for videos/large images (localStorage may fail).', 'info');
          }

          const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
          const reader = new FileReader();
          reader.onload = () => {
            app.ui.portfolioDraftMedia = { mediaType, src: String(reader.result || '') };
            showToast('File loaded. Save to store it.', 'success');
            render();
          };
          reader.onerror = () => showToast('Could not read file.', 'error');
          reader.readAsDataURL(file);
        }
      });

      // ----------------- Events: forms -----------------
      document.addEventListener('submit', async (e) => {
        const form = e.target;

        if (form && form.id === 'form-quick-quote') {
          e.preventDefault();
          const fd = new FormData(form);
          const entry = {
            id: uid(),
            kind: 'quote',
            name: String(fd.get('name') || '').trim(),
            email: String(fd.get('email') || '').trim(),
            subject: `Quick quote ' ${String(fd.get('service') || 'Project')}`,
            message: String(fd.get('message') || '').trim(),
            status: 'new',
            ts: now()
          };
          app.data.inquiries = app.data.inquiries || [];
          app.data.inquiries.push(entry);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save request (storage full).', 'error');
            return;
          }
          form.reset();
          showToast('Request saved! We\'ll reply via email. Try Chat for fastest.', 'success');
          return;
        }

        if (form && form.id === 'form-contact') {
          e.preventDefault();
          const fd = new FormData(form);
          const entry = {
            id: uid(),
            kind: 'contact',
            name: String(fd.get('name') || '').trim(),
            email: String(fd.get('email') || '').trim(),
            subject: String(fd.get('subject') || '').trim(),
            message: String(fd.get('message') || '').trim(),
            status: 'new',
            ts: now()
          };
          app.data.inquiries = app.data.inquiries || [];
          app.data.inquiries.push(entry);
          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save message (storage full).', 'error');
            return;
          }
          form.reset();
          showToast('Message saved! Admin can view it in Inquiries.', 'success');
          return;
        }

        if (form && form.id === 'form-chat-identify') {
          e.preventDefault();
          const fd = new FormData(form);
          const name = String(fd.get('name') || '').trim();
          const email = String(fd.get('email') || '').trim();
          if (!email) {
            showToast('Email is required for chat.', 'error');
            return;
          }
          const thread = getOrCreateThread(name, email);
          saveJSON(STORAGE_KEYS.chatIdentity, { name, email, lastThreadId: thread.id });
          thread.clientLastReadAt = now();
          app.data.updatedAt = now();
          trySaveData(app.data);
          showToast('Chat opened.', 'success');
          render();
          return;
        }

        if (form && form.id === 'form-chat-send') {
          e.preventDefault();
          const id = loadJSON(STORAGE_KEYS.chatIdentity, null)?.lastThreadId;
          const thread = id ? app.data.chat.threads[id] : null;
          if (!thread) {
            showToast('Open a chat first.', 'info');
            return;
          }
          const fd = new FormData(form);
          const text = String(fd.get('text') || '').trim();
          if (!text) return;
          try {
            addMessageToThread(thread.id, 'client', text);
          } catch {
            showToast('Could not send (storage full).', 'error');
            return;
          }
          form.reset();
          showToast('Sent.', 'success');
          render();
          return;
        }

        if (form && form.id === 'form-admin-chat-reply') {
          e.preventDefault();
          const fd = new FormData(form);
          const threadId = String(fd.get('threadId') || '');
          const text = String(fd.get('text') || '').trim();
          if (!threadId) return;
          if (!text) return;
          try {
            addMessageToThread(threadId, 'admin', text);
            const t = app.data.chat.threads[threadId];
            if (t) t.adminLastReadAt = now();
            trySaveData(app.data);
          } catch {
            showToast('Could not send reply (storage full).', 'error');
            return;
          }
          form.reset();
          showToast('Reply sent.', 'success');
          render();
          return;
        }

        if (form && form.id === 'form-signup') {
          e.preventDefault();
          const fd = new FormData(form);
          const email = String(fd.get('email') || '').trim().toLowerCase();
          const password = String(fd.get('password') || '');

          const accounts = getAccounts();
          accounts.users = accounts.users || {};
          if (accounts.users[email]) {
            showToast('Account already exists. Try signing in.', 'info');
            go('/auth?mode=signin');
            return;
          }
          const salt = uid();
          const hash = await sha256Hex(salt + ':' + password);
          accounts.users[email] = { email, salt, hash, createdAt: now() };
          saveJSON(STORAGE_KEYS.accounts, accounts);

          setSession(email);
          app.accounts = getAccounts();
          app.session = getSession();

          const next = app.route.query.get('next');
          showToast(isAdminEmail(email) ? 'Admin account created & signed in.' : 'Account created & signed in.', 'success');
          go(next ? decodeURIComponent(next) : '/home');
          return;
        }

        if (form && form.id === 'form-signin') {
          e.preventDefault();
          const fd = new FormData(form);
          const email = String(fd.get('email') || '').trim().toLowerCase();
          const password = String(fd.get('password') || '');

          const accounts = getAccounts();
          const user = accounts.users?.[email];
          if (!user) {
            showToast('No account found. Create one first.', 'info');
            go('/auth?mode=signup');
            return;
          }

          const hash = await sha256Hex(user.salt + ':' + password);
          if (hash !== user.hash) {
            showToast('Wrong password.', 'error');
            return;
          }

          setSession(email);
          app.accounts = getAccounts();
          app.session = getSession();

          const next = app.route.query.get('next');
          showToast(isAdminEmail(email) ? 'Signed in as admin.' : 'Signed in.', 'success');
          go(next ? decodeURIComponent(next) : '/home');
          return;
        }

        if (form && form.id === 'form-admin-portfolio') {
          e.preventDefault();
          const fd = new FormData(form);
          const id = String(fd.get('id') || '').trim();
          const title = String(fd.get('title') || '').trim();
          const category = String(fd.get('category') || '').trim() || 'Uncategorized';
          const description = String(fd.get('description') || '').trim();
          const mediaUrl = String(fd.get('mediaUrl') || '').trim();

          let finalSrc = mediaUrl;
          let mediaType = null;

          if (app.ui.portfolioDraftMedia?.src) {
            finalSrc = app.ui.portfolioDraftMedia.src;
            mediaType = app.ui.portfolioDraftMedia.mediaType;
          }

          const inferred = inferMediaTypeFromSrc(finalSrc);
          mediaType = mediaType || inferred.mediaType;

          if (!title) {
            showToast('Title is required.', 'error');
            return;
          }
          if (!finalSrc) {
            showToast('Provide a Media URL or upload a file.', 'error');
            return;
          }

          app.data.portfolio = app.data.portfolio || [];
          if (id) {
            const item = app.data.portfolio.find(x => x.id === id);
            if (!item) {
              showToast('Item not found.', 'error');
              return;
            }
            item.title = title;
            item.category = category;
            item.description = description;
            item.mediaType = mediaType;
            item.src = inferred.mediaType === 'embed' ? inferred.src : finalSrc;
          } else {
            app.data.portfolio.push({
              id: uid(),
              title,
              category,
              description,
              mediaType,
              src: inferred.mediaType === 'embed' ? inferred.src : finalSrc,
              createdAt: now()
            });
          }

          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save. Storage may be full (use URLs for videos).', 'error');
            return;
          }

          app.ui.portfolioDraftMedia = null;
          showToast(id ? 'Portfolio item updated.' : 'Portfolio item added.', 'success');
          go('/admin/portfolio');
          return;
        }

        if (form && form.id === 'form-admin-service') {
          e.preventDefault();
          const fd = new FormData(form);
          const id = String(fd.get('id') || '').trim();
          const name = String(fd.get('name') || '').trim();
          const price = Number(fd.get('price'));
          const currency = String(fd.get('currency') || '$').trim() || '$';
          const popular = !!fd.get('popular');
          const description = String(fd.get('description') || '').trim();
          const bulletsRaw = String(fd.get('bullets') || '');
          const bullets = bulletsRaw.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 12);

          if (!name || !Number.isFinite(price)) {
            showToast('Name and price are required.', 'error');
            return;
          }

          app.data.services = app.data.services || [];
          if (id) {
            const s = app.data.services.find(x => x.id === id);
            if (!s) {
              showToast('Service not found.', 'error');
              return;
            }
            s.name = name;
            s.price = price;
            s.currency = currency;
            s.popular = popular;
            s.description = description;
            s.bullets = bullets;
          } else {
            app.data.services.push({ id: uid(), name, price, currency, popular, description, bullets });
          }

          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }

          showToast(id ? 'Service updated.' : 'Service added.', 'success');
          go('/admin/services');
          return;
        }

        if (form && form.id === 'form-admin-discount') {
          e.preventDefault();
          const fd = new FormData(form);
          const id = String(fd.get('id') || '').trim();
          const title = String(fd.get('title') || '').trim();
          const percent = Number(fd.get('percent'));
          const code = String(fd.get('code') || '').trim().toUpperCase();
          const until = String(fd.get('until') || '').trim();
          const details = String(fd.get('details') || '').trim();
          const active = !!fd.get('active');

          if (!title || !Number.isFinite(percent) || !code) {
            showToast('Title, percent, and code are required.', 'error');
            return;
          }

          app.data.discounts = app.data.discounts || [];
          if (id) {
            const d = app.data.discounts.find(x => x.id === id);
            if (!d) {
              showToast('Discount not found.', 'error');
              return;
            }
            d.title = title;
            d.percent = percent;
            d.code = code;
            d.until = until;
            d.details = details;
            d.active = active;
          } else {
            app.data.discounts.push({ id: uid(), title, percent, code, until, details, active });
          }

          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }

          showToast(id ? 'Discount updated.' : 'Discount added.', 'success');
          go('/admin/discounts');
          return;
        }

        if (form && form.id === 'form-admin-site') {
          e.preventDefault();
          const fd = new FormData(form);
          app.data.site.brandName = String(fd.get('brandName') || '').trim() || app.data.site.brandName;
          app.data.site.tagline = String(fd.get('tagline') || '').trim();
          app.data.site.heroImageUrl = String(fd.get('heroImageUrl') || '').trim();
          app.data.site.about = String(fd.get('about') || '').trim();

          app.data.site.contact = app.data.site.contact || {};
          app.data.site.contact.email = String(fd.get('contactEmail') || '').trim();
          app.data.site.contact.phone = String(fd.get('phone') || '').trim();
          app.data.site.contact.address = String(fd.get('address') || '').trim();
          app.data.site.contact.whatsapp = String(fd.get('whatsapp') || '').trim();

          app.data.site.socials = app.data.site.socials || {};
          app.data.site.socials.instagram = String(fd.get('instagram') || '').trim();
          app.data.site.socials.behance = String(fd.get('behance') || '').trim();
          app.data.site.socials.tiktok = String(fd.get('tiktok') || '').trim();

          app.data.updatedAt = now();
          const err = trySaveData(app.data);
          if (err) {
            showToast('Could not save changes.', 'error');
            return;
          }
          showToast('Site settings saved.', 'success');
          render();
          return;
        }
      });

      // ----------------- Router + cross-tab sync -----------------
      window.addEventListener('hashchange', () => {
        app.ui.mobileOpen = false;
        render();
      });

      window.addEventListener('storage', (e) => {
        if (![STORAGE_KEYS.data, STORAGE_KEYS.accounts, STORAGE_KEYS.session].includes(e.key)) return;
        app.data = getData();
        app.accounts = getAccounts();
        app.session = getSession();
        render();
      });

      // Initial render
      render();

      // Light polling for chat updates in same tab
      setInterval(() => {
        const prev = app.data.updatedAt;
        const fresh = getData();
        if (fresh.updatedAt !== prev) {
          app.data = fresh;
          render();
        }
      }, 1500);
    })();
  </script>
</body>
</html>
